r damage arising from use of the site, the models, or the corpus.`]})]})},{id:`acceptable-use`,heading:`Acceptable use`,body:(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)(`p`,{children:`You agree not to:`}),(0,f.jsxs)(`ul`,{children:[(0,f.jsx)(`li`,{children:`Use the Studio or the corpus to produce material that harasses, defames, or endangers Nuer or Dinka speakers or any other community.`}),(0,f.jsxs)(`li`,{children:[`Present machine output as a verified human translation, or as endorsed by `,k.name,`.`]}),(0,f.jsx)(`li`,{children:`Automate requests at a volume that degrades the service for others. The corpus files are not rate-limited; please cache or mirror them rather than re-fetching in a loop.`}),(0,f.jsx)(`li`,{children:`Strip attribution or provenance from redistributed data, or relicense openly-contributed community material under more restrictive terms.`}),(0,f.jsx)(`li`,{children:`Submit contributions you do not have the right to share, including copyrighted material or recordings of people who did not consent.`})]})]})},{id:`contributions`,heading:`Contributions`,body:(0,f.jsxs)(f.Fragment,{children:[(0,f.jsxs)(`p`,{children:[`When you contribute data, audio, or code, you confirm that you have the right to do so and you agree that it may be published as part of the open corpus under the project's terms. Contributions arrive through a`,` `,(0,f.jsx)(`a`,{href:A.repoUrl,target:`_blank`,rel:`noreferrer`,children:`public GitHub organisation`}),`.`]}),(0,f.jsx)(`p`,{children:`You keep authorship credit on what you contribute, and you may ask to be anonymised instead. We commit that community contributions stay openly licensed: they will not be moved behind a paywall or relicensed restrictively at a later date.`}),(0,f.jsx)(`p`,{children:`Contributions are reviewed by native speakers and may be edited, corrected, or declined. Review is a judgement about linguistic accuracy, not about you.`})]})},{id:`third-party`,heading:`Third-party services`,body:(0,f.jsxs)(`p  a model saying something forbidden. It is a model producing`,` `,(0,f.jsx)(`b`,{className:`text-ink-900`,children:`confident, fluent, wrong Nuer or Dinka`}),` that no one in the loop can check — and having that output treated as authoritative precisely because nothing else exists to compare it against. A wrong gloss in the only available dictionary does not get corrected by the market; it gets copied.`]}),(0,f.jsx)(`p`,{children:`So our safety work concentrates on provenance, on refusing to generate what we cannot attest, and on keeping speakers in the review position rather than the consumer position.`})]})},{id:`commitments`,heading:`What we do about it`,body:(0,f.jsxs)(`ul`,{children:[(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`b`,{className:`text-ink-900`,children:`Retrieval over generation, where it counts.`}),` The chat assistant returns only attested phrases from the reviewed corpus and says plainly when it has no match. It would be easy to make it fluent by letting it invent Nuer or Dinka; that would also make it a machine for teaching learners errors.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`b`,{className:`text-ink-900`,children:`Native-speaker review as a gate, not a garnish.`}),` Nothing enters the published corpus without a speaker signing off on it.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`b`,{className:`text-ink-900`,children:`Provenance on every record.`}),` Each entry carries its source, so an error can be traced to where it came from and corrected everywhere it propagated.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`b`,{className:`text-ink-900`,children:`Honest status labels.`}),` Our`,` `,(0,f.jsx)(`a`,{href:`#/models`,children:`models page`}),` states which features are real models and which are still browser fallbacks. Voice input currently has no Nuer or Dinka acoustic model and we say so on the page rather than letting the interface imply otherwise.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`b`,{className:`text-ink-900`,children:`One documented speech provider.`}),` Nuer and Dinka text-to-speech both run through the same named provider — Meta's MMS models — rather than a patchwork of undisclosed backends, so what processes your text is never a mystery.`]}),(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`b`,{className:`text-ink-900`,children:`No fabricated metrics.`}),` We do not publish benchmark scores for languages with no established benchmark, because a number computed against our own held-out data would imply a rigour that does not exist.`]})]})},{id:`high-stakes`,heading:`Where not to use these tools`,body:(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)(`p`,{children:`Please do not rely on automated translation from this site, without a qualified human translator, in any of the following:`}),(0,f.jsxs)(`ul`,{children:[(0,f.jsx)(`li`,{children:`Medical consultation, diagnosis, consent, or medication instructions`}),(0,f.jsx)(`li`,{children:`Legal proceedings, asylum and immigration interviews, or police interaction`}),(0,f.jsx)(`li`,{children:`Emergency and humanitarian response where a misunderstanding risks safety`}),(0,f.jsx)(`li`,{children:`Financial or contractual agreements`}),(0,f.jsx)(`li`,{children:`Child protection and safeguarding contexts`})]}),(0,f.jsx)(`p`,{children:`This is not boilerplate risk-aversion. Displaced and minority-language speakers are routinely handed machine translation in exactly these settings because a human interpreter is expensive or unavailable, and the failure lands on the person least able to challenge it. Our output is not good enough for that, and we would rather lose the use case than pretend otherwise.`})]})},{id:`data-ethics`,heading:`Community consent and data ethics`,body:(0,f.jsxs)(f.Fragment,{children:[(0,f.jsx)(`p`,{children:`Language data is not neutral raw material. It is produced by communities who have often seen their cultural knowledge extracted without benefit returning to them.`}),(0,f.jsxs)(`ul`,{children:[(0,f.jsxs)(`li`,{children:[(0,f.jsx)(`b`,{className:`text-i
